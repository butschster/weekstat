name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}
            name="weekstat_${os}_${arch}"
            echo ">> $name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/$name" .
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
            rm "dist/$name"
          done
          # tray indicator (Linux/GNOME only)
          for arch in amd64 arm64; do
            name="weekstat-tray_linux_${arch}"
            echo ">> $name"
            ( cd tray && CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "../dist/$name" . )
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
            rm "dist/$name"
          done
          ( cd dist && sha256sum *.tar.gz > checksums.txt )
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
